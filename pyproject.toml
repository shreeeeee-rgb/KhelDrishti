[project]
name = "kheldrishti"
version = "1.0.0"
description = "KhelDrishti - Edge AI Sports Biomechanics Coach for Grassroots Athletes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "opencv-python-headless>=4.9.0",
    "mediapipe>=0.10.9",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.6.0",
    "aiofiles>=23.2.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
